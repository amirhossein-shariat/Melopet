name: Build Melopet

# Every push: checks the backend (vet, build, smoke test) and the app (analyze, test).
# The Android APK + release files are built ONLY on demand:
#   Actions → Build Melopet → Run workflow (optionally with your server address),
#   or by pushing a tag like v1.0.0.

on:
  push:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend URL baked into the APK (e.g. https://api.melopet.ir)"
        required: false

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - name: Build server binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/melopet-server-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/melopet-server-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/melopet-server-windows-amd64.exe .
      - name: Smoke test (migrations + health)
        run: |
          ./dist/melopet-server-linux-amd64 serve --http=127.0.0.1:8090 --dir=/tmp/pb &
          for i in $(seq 1 20); do curl -fs 127.0.0.1:8090/api/health && break; sleep 1; done
          curl -fs 127.0.0.1:8090/api/collections/settings/records | grep -q "ملوپت"
      - uses: actions/upload-artifact@v4
        with:
          name: melopet-server
          path: backend/dist/*

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    # on demand only — a normal push does not build the APK
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs: [check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      API_URL: ${{ github.event.inputs.api_url || vars.API_URL || 'http://10.0.2.2:8090' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release signing (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/melopet.jks
          cat > android/key.properties <<EOF
          storeFile=melopet.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      - name: Build APK
        run: flutter build apk --release --dart-define=API_URL="$API_URL"
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/melopet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: melopet-apk
          path: app/build/app/outputs/flutter-apk/melopet.apk

  release:
    # Publishes downloadable files on every build:
    #   - pushes to a branch  → pre-release "latest-build" (replaced each time)
    #   - tags v*              → a normal versioned release
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs: [backend, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        run: |
          set -euo pipefail
          files="dist/melopet-apk/melopet.apk dist/melopet-server/*"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" $files --repo "$REPO" --title "$GITHUB_REF_NAME" --latest \
              --notes "Melopet $GITHUB_REF_NAME: melopet.apk (Android app) and melopet-server-* (backend)."
          else
            # remove the previous latest-build release (published or draft) and its tag, then publish again
            for id in $(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(.tag_name=="latest-build") | .id'); do
              gh api -X DELETE "repos/$REPO/releases/$id"
            done
            gh api -X DELETE "repos/$REPO/git/refs/tags/latest-build" || true
            gh release create latest-build $files --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
              --title "Latest build ($GITHUB_REF_NAME)" \
              --notes "Melopet build from $GITHUB_SHA: melopet.apk (Android app) and melopet-server-* (backend)."
          fi
