name: Build Melopet

# Builds the Android APK and the server binaries on every push.
# Run manually (Actions → Build Melopet → Run workflow) to bake your server
# address into the APK, or set the repository variable API_URL once.

on:
  push:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend URL baked into the APK (e.g. https://api.melopet.ir)"
        required: false

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - name: Build server binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/melopet-server-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/melopet-server-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/melopet-server-windows-amd64.exe .
      - name: Smoke test (migrations + health)
        run: |
          ./dist/melopet-server-linux-amd64 serve --http=127.0.0.1:8090 --dir=/tmp/pb &
          for i in $(seq 1 20); do curl -fs 127.0.0.1:8090/api/health && break; sleep 1; done
          curl -fs 127.0.0.1:8090/api/collections/settings/records | grep -q "ملوپت"
      - uses: actions/upload-artifact@v4
        with:
          name: melopet-server
          path: backend/dist/*

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      API_URL: ${{ github.event.inputs.api_url || vars.API_URL || 'http://10.0.2.2:8090' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Release signing (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/melopet.jks
          cat > android/key.properties <<EOF
          storeFile=melopet.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      - name: Build APK
        run: flutter build apk --release --dart-define=API_URL="$API_URL"
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/melopet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: melopet-apk
          path: app/build/app/outputs/flutter-apk/melopet.apk

  release:
    # Publishes downloadable files on every build:
    #   - pushes to a branch  → pre-release "latest-build" (replaced each time)
    #   - tags v* (v1.0.0...)  → a normal versioned release
    needs: [backend, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest-build' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Replace previous latest-build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gh release delete latest-build --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Latest build ({0})', github.ref_name) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          body: |
            Melopet build from `${{ github.sha }}`.
            - `melopet.apk` — Android app
            - `melopet-server-*` — backend server binaries
          files: |
            dist/melopet-apk/melopet.apk
            dist/melopet-server/*
